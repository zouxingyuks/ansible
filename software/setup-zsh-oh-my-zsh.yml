---
- name: Setup zsh and Oh My Zsh
  hosts: all
  gather_facts: false
  serial: 1

  vars:
    ansible_port: 36633
    zsh_setup_execute: false
    zsh_setup_begin_marker: "# BEGIN ANSIBLE MANAGED ZSH OH MY ZSH"
    zsh_setup_end_marker: "# END ANSIBLE MANAGED ZSH OH MY ZSH"
    zsh_setup_repositories:
      - url: https://github.com/ohmyzsh/ohmyzsh.git
        dest: "{{ zsh_setup_home }}/.oh-my-zsh"
      - url: https://github.com/zsh-users/zsh-autosuggestions.git
        dest: "{{ zsh_setup_home }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
      - url: https://github.com/zsh-users/zsh-syntax-highlighting.git
        dest: "{{ zsh_setup_home }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"

  tasks:
    - name: Preflight | verify required zsh setup variables
      ansible.builtin.assert:
        that:
          - zsh_setup_user is defined
          - zsh_setup_user is string
          - zsh_setup_user | length > 0
          - zsh_setup_user is match('^[A-Za-z_][A-Za-z0-9_.-]*[$]?$')
          - zsh_setup_home is defined
          - zsh_setup_home is string
          - zsh_setup_home is match('^/[^\n\r\x00]*$')
          - zsh_setup_home != '/'
        fail_msg: "zsh_setup_user and absolute zsh_setup_home are required. Example: -e zsh_setup_user=ubuntu -e zsh_setup_home=/home/ubuntu"
        success_msg: "zsh setup variables are valid"

    - name: Preflight | inspect zsh setup target
      ansible.builtin.raw: |
        set -eu

        zsh_user={{ zsh_setup_user | quote }}
        zsh_home={{ zsh_setup_home | quote }}
        zshrc="$zsh_home/.zshrc"
        begin_marker={{ zsh_setup_begin_marker | quote }}
        end_marker={{ zsh_setup_end_marker | quote }}

        fail() {
          echo "FAIL: $1"
          exit "$2"
        }

        run_as_root() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          else
            sudo -n "$@"
          fi
        }

        check_repo_path() {
          repo_url="$1"
          repo_dest="$2"
          case "$repo_dest" in
            "$zsh_home"/.oh-my-zsh|"$zsh_home"/.oh-my-zsh/custom/plugins/zsh-autosuggestions|"$zsh_home"/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting) ;;
            *) fail "unsafe repository destination: $repo_dest" 30 ;;
          esac
          if [ -e "$repo_dest" ]; then
            [ ! -L "$repo_dest" ] || fail "repository destination is a symlink and will not be used: $repo_dest" 34
            [ -d "$repo_dest" ] || fail "repository destination exists but is not a directory: $repo_dest" 31
            [ -d "$repo_dest/.git" ] || fail "repository destination exists but is not a Git checkout: $repo_dest" 32
            origin=$(git -C "$repo_dest" config --get remote.origin.url || true)
            [ "$origin" = "$repo_url" ] || fail "repository origin mismatch at $repo_dest: expected $repo_url, got $origin" 33
            echo "OK: existing repository checkout has expected origin: $repo_dest"
          else
            repo_parent=$(dirname "$repo_dest")
            if [ -e "$repo_parent" ]; then
              [ ! -L "$repo_parent" ] || fail "repository parent is a symlink and will not be used: $repo_parent" 35
              [ -d "$repo_parent" ] || fail "repository parent exists but is not a directory: $repo_parent" 36
            fi
            echo "OK: repository will be cloned if execution is enabled: $repo_dest"
          fi
        }

        check_markers() {
          target_file="$1"
          if [ ! -e "$target_file" ]; then
            echo "OK: .zshrc will be created if execution is enabled: $target_file"
            return 0
          fi
          [ ! -L "$target_file" ] || fail ".zshrc path is a symlink and will not be managed: $target_file" 42
          [ -f "$target_file" ] || fail ".zshrc path exists but is not a regular file: $target_file" 40
          marker_report=$(awk -v begin="$begin_marker" -v end="$end_marker" '
            $0 == begin { begin_count++; if (first_begin == 0) first_begin = NR }
            $0 == end { end_count++; if (first_end == 0) first_end = NR }
            END { printf "%s %s %s %s\n", begin_count + 0, end_count + 0, first_begin + 0, first_end + 0 }
          ' "$target_file")
          set -- $marker_report
          begin_count="$1"
          end_count="$2"
          first_begin="$3"
          first_end="$4"
          if [ "$begin_count" -eq 0 ] && [ "$end_count" -eq 0 ]; then
            echo "OK: .zshrc has no managed marker block yet: $target_file"
          elif [ "$begin_count" -eq 1 ] && [ "$end_count" -eq 1 ] && [ "$first_begin" -lt "$first_end" ]; then
            echo "OK: .zshrc has one valid managed marker block: $target_file"
          else
            fail ".zshrc has partial, duplicate, or reversed managed markers: begin=$begin_count end=$end_count first_begin=$first_begin first_end=$first_end" 41
          fi
        }

        account_home=$(getent passwd "$zsh_user" | awk -F: '{ print $6 }')
        [ -n "$account_home" ] || fail "account not found via getent passwd: $zsh_user" 20
        [ "$account_home" = "$zsh_home" ] || fail "zsh_setup_home must match getent passwd home for $zsh_user: expected $account_home, got $zsh_home" 21
        [ -d "$zsh_home" ] || fail "zsh_setup_home does not exist as a directory: $zsh_home" 22

        if [ "$(id -u)" -eq 0 ]; then
          :
        elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
          :
        else
          fail "current user must be root or have passwordless sudo" 23
        fi

        command -v apt-get >/dev/null 2>&1 || fail "apt-get is required for installing zsh, git, and autojump" 24
        command -v git >/dev/null 2>&1 || echo "NOTE: git is not installed yet; execution will install it before cloning"
        run_as_root test -w "$zsh_home" || fail "cannot write to zsh_setup_home as root or passwordless sudo: $zsh_home" 25
        run_as_user() {
          if [ "$(id -u -n)" = "$zsh_user" ]; then
            HOME="$zsh_home" "$@"
          elif [ "$(id -u)" -eq 0 ] && command -v runuser >/dev/null 2>&1; then
            runuser -u "$zsh_user" -- env HOME="$zsh_home" "$@"
          elif [ "$(id -u)" -eq 0 ] && command -v sudo >/dev/null 2>&1; then
            sudo -H -u "$zsh_user" env HOME="$zsh_home" "$@"
          else
            sudo -n -H -u "$zsh_user" env HOME="$zsh_home" "$@"
          fi
        }

        if [ "$(id -u -n)" != "$zsh_user" ]; then
          if [ "$(id -u)" -eq 0 ]; then
            command -v runuser >/dev/null 2>&1 || command -v sudo >/dev/null 2>&1 || fail "runuser or sudo is required to run commands as $zsh_user" 26
          else
            command -v sudo >/dev/null 2>&1 || fail "sudo is required to run commands as $zsh_user when connected as another account" 26
          fi
        fi
        run_as_user test -d "$zsh_home" || fail "cannot run commands as zsh_setup_user: $zsh_user" 27

        check_repo_path https://github.com/ohmyzsh/ohmyzsh.git "$zsh_home/.oh-my-zsh"
        check_repo_path https://github.com/zsh-users/zsh-autosuggestions.git "$zsh_home/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
        check_repo_path https://github.com/zsh-users/zsh-syntax-highlighting.git "$zsh_home/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
        check_markers "$zshrc"

        echo "zsh_setup_execute={{ zsh_setup_execute }}"
        echo "zsh_setup_user=$zsh_user"
        echo "zsh_setup_home=$zsh_home"
        echo "OK: zsh setup preflight checks passed"
      register: zsh_setup_preflight_result
      changed_when: false
      failed_when: zsh_setup_preflight_result.rc != 0

    - name: Show zsh setup preflight result
      ansible.builtin.debug:
        var: zsh_setup_preflight_result.stdout_lines

    - name: Preview | show zsh setup plan
      ansible.builtin.raw: |
        set -eu

        zsh_user={{ zsh_setup_user | quote }}
        zsh_home={{ zsh_setup_home | quote }}
        zshrc="$zsh_home/.zshrc"

        echo "zsh_setup_execute={{ zsh_setup_execute }}"
        echo "zsh_setup_user=$zsh_user"
        echo "zsh_setup_home=$zsh_home"
        echo "Packages to install when execution is enabled: zsh git autojump"
        echo "Repositories to clone when missing and execution is enabled:"
        {% for repo in zsh_setup_repositories %}
        echo {{ (repo.url ~ ' -> ' ~ repo.dest) | quote }}
        {% endfor %}
        echo "Managed .zshrc path: $zshrc"
        echo "Managed .zshrc block:"
        cat <<'ZSH_SETUP_BLOCK_PREVIEW_EOF'
        {{ zsh_setup_begin_marker }}
        export ZSH="$HOME/.oh-my-zsh"
        zstyle ':omz:update' mode disabled
        DISABLE_MAGIC_FUNCTIONS=true
        plugins=(autojump zsh-autosuggestions zsh-syntax-highlighting)
        source "$ZSH/oh-my-zsh.sh"
        {{ zsh_setup_end_marker }}
        ZSH_SETUP_BLOCK_PREVIEW_EOF
        echo "No packages, repositories, or .zshrc content will be changed unless zsh_setup_execute=true."
      register: zsh_setup_preview_result
      changed_when: false
      failed_when: zsh_setup_preview_result.rc != 0

    - name: Show zsh setup preview result
      ansible.builtin.debug:
        var: zsh_setup_preview_result.stdout_lines

    - name: Safety | explain dry-run mode
      ansible.builtin.raw: |
        echo "No zsh or Oh My Zsh setup performed."
        echo "Re-run with -e zsh_setup_execute=true after reviewing the preview and using a canary host."
      register: zsh_setup_safety_result
      changed_when: false
      failed_when: false
      when: not (zsh_setup_execute | bool)

    - name: Show zsh setup safety result
      ansible.builtin.debug:
        var: zsh_setup_safety_result.stdout_lines
      when: not (zsh_setup_execute | bool)

    - name: Setup | install zsh and clone Oh My Zsh repositories
      ansible.builtin.raw: |
        set -eu

        zsh_user={{ zsh_setup_user | quote }}
        zsh_home={{ zsh_setup_home | quote }}

        fail() {
          echo "FAIL: $1"
          exit "$2"
        }

        run_as_root() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          else
            sudo -n "$@"
          fi
        }

        run_as_user() {
          if [ "$(id -u -n)" = "$zsh_user" ]; then
            HOME="$zsh_home" "$@"
          elif [ "$(id -u)" -eq 0 ] && command -v runuser >/dev/null 2>&1; then
            runuser -u "$zsh_user" -- env HOME="$zsh_home" "$@"
          elif [ "$(id -u)" -eq 0 ] && command -v sudo >/dev/null 2>&1; then
            sudo -H -u "$zsh_user" env HOME="$zsh_home" "$@"
          else
            sudo -n -H -u "$zsh_user" env HOME="$zsh_home" "$@"
          fi
        }

        ensure_packages() {
          missing_packages=""
          for package_name in zsh git autojump; do
            if ! dpkg-query -W -f='${Status}' "$package_name" 2>/dev/null | grep -Fqx 'install ok installed'; then
              missing_packages="$missing_packages $package_name"
            fi
          done

          if [ -z "$missing_packages" ]; then
            echo "OK: apt packages already installed: zsh git autojump"
            return 0
          fi

          run_as_root apt-get update
          run_as_root apt-get install -y zsh git autojump
          echo "CHANGED: installed missing apt packages:$missing_packages"
        }

        ensure_repo() {
          repo_url="$1"
          repo_dest="$2"
          case "$repo_dest" in
            "$zsh_home"/.oh-my-zsh|"$zsh_home"/.oh-my-zsh/custom/plugins/zsh-autosuggestions|"$zsh_home"/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting) ;;
            *) fail "unsafe repository destination: $repo_dest" 30 ;;
          esac
          if [ -e "$repo_dest" ]; then
            [ ! -L "$repo_dest" ] || fail "repository destination is a symlink and will not be used: $repo_dest" 34
            [ -d "$repo_dest" ] || fail "repository destination exists but is not a directory: $repo_dest" 31
            [ -d "$repo_dest/.git" ] || fail "repository destination exists but is not a Git checkout: $repo_dest" 32
            origin=$(git -C "$repo_dest" config --get remote.origin.url || true)
            [ "$origin" = "$repo_url" ] || fail "repository origin mismatch at $repo_dest: expected $repo_url, got $origin" 33
            echo "OK: repository already exists with expected origin: $repo_dest"
            return 0
          fi
          parent=$(dirname "$repo_dest")
          if [ -e "$parent" ]; then
            [ ! -L "$parent" ] || fail "repository parent is a symlink and will not be used: $parent" 35
            [ -d "$parent" ] || fail "repository parent exists but is not a directory: $parent" 36
          fi
          run_as_root mkdir -p "$parent"
          run_as_root chown "$zsh_user:" "$parent"
          run_as_user git clone "$repo_url" "$repo_dest"
          echo "CHANGED: cloned $repo_url to $repo_dest"
        }

        account_home=$(getent passwd "$zsh_user" | awk -F: '{ print $6 }')
        [ "$account_home" = "$zsh_home" ] || fail "zsh_setup_home must match getent passwd home for $zsh_user: expected $account_home, got $zsh_home" 20

        ensure_packages

        ensure_repo https://github.com/ohmyzsh/ohmyzsh.git "$zsh_home/.oh-my-zsh"
        ensure_repo https://github.com/zsh-users/zsh-autosuggestions.git "$zsh_home/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
        ensure_repo https://github.com/zsh-users/zsh-syntax-highlighting.git "$zsh_home/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
      register: zsh_setup_install_result
      changed_when: "'CHANGED:' in zsh_setup_install_result.stdout"
      failed_when: zsh_setup_install_result.rc != 0
      when: zsh_setup_execute | bool

    - name: Show zsh setup install result
      ansible.builtin.debug:
        var: zsh_setup_install_result.stdout_lines
      when: zsh_setup_execute | bool

    - name: Setup | manage zshrc block
      ansible.builtin.raw: |
        set -eu

        zsh_user={{ zsh_setup_user | quote }}
        zsh_home={{ zsh_setup_home | quote }}
        zshrc="$zsh_home/.zshrc"
        begin_marker={{ zsh_setup_begin_marker | quote }}
        end_marker={{ zsh_setup_end_marker | quote }}
        tmp_dir="/tmp/ansible-zsh-setup.$$"
        mkdir -p "$tmp_dir"
        trap 'rm -rf "$tmp_dir"' EXIT HUP INT TERM

        fail() {
          echo "FAIL: $1"
          exit "$2"
        }

        run_as_root() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          else
            sudo -n "$@"
          fi
        }

        check_markers() {
          target_file="$1"
          if [ ! -e "$target_file" ]; then
            return 0
          fi
          [ ! -L "$target_file" ] || fail ".zshrc path is a symlink and will not be managed: $target_file" 42
          [ -f "$target_file" ] || fail ".zshrc path exists but is not a regular file: $target_file" 40
          marker_report=$(awk -v begin="$begin_marker" -v end="$end_marker" '
            $0 == begin { begin_count++; if (first_begin == 0) first_begin = NR }
            $0 == end { end_count++; if (first_end == 0) first_end = NR }
            END { printf "%s %s %s %s\n", begin_count + 0, end_count + 0, first_begin + 0, first_end + 0 }
          ' "$target_file")
          set -- $marker_report
          begin_count="$1"
          end_count="$2"
          first_begin="$3"
          first_end="$4"
          if [ "$begin_count" -eq 0 ] && [ "$end_count" -eq 0 ]; then
            return 0
          fi
          if [ "$begin_count" -eq 1 ] && [ "$end_count" -eq 1 ] && [ "$first_begin" -lt "$first_end" ]; then
            return 0
          fi
          fail ".zshrc has partial, duplicate, or reversed managed markers: begin=$begin_count end=$end_count first_begin=$first_begin first_end=$first_end" 41
        }

        account_home=$(getent passwd "$zsh_user" | awk -F: '{ print $6 }')
        [ "$account_home" = "$zsh_home" ] || fail "zsh_setup_home must match getent passwd home for $zsh_user: expected $account_home, got $zsh_home" 20
        check_markers "$zshrc"

        current_file="$tmp_dir/current"
        stripped_file="$tmp_dir/stripped"
        block_file="$tmp_dir/block"
        candidate_file="$tmp_dir/candidate"

        if [ -f "$zshrc" ]; then
          cp "$zshrc" "$current_file"
        else
          : > "$current_file"
        fi

        awk -v begin="$begin_marker" -v end="$end_marker" '
          $0 == begin { skip = 1; next }
          $0 == end { skip = 0; next }
          !skip { print }
        ' "$current_file" > "$stripped_file"

        cat > "$block_file" <<'ZSH_SETUP_BLOCK_EOF'
        {{ zsh_setup_begin_marker }}
        export ZSH="$HOME/.oh-my-zsh"
        zstyle ':omz:update' mode disabled
        DISABLE_MAGIC_FUNCTIONS=true
        plugins=(autojump zsh-autosuggestions zsh-syntax-highlighting)
        source "$ZSH/oh-my-zsh.sh"
        {{ zsh_setup_end_marker }}
        ZSH_SETUP_BLOCK_EOF

        cat "$stripped_file" "$block_file" > "$candidate_file"
        zsh -n "$candidate_file"

        if [ -f "$zshrc" ] && cmp -s "$candidate_file" "$zshrc"; then
          echo "OK: .zshrc managed block is already current: $zshrc"
          exit 0
        fi

        run_as_root cp "$candidate_file" "$zshrc"
        run_as_root chown "$zsh_user:" "$zshrc"
        run_as_root chmod 0644 "$zshrc"
        echo "CHANGED: updated managed .zshrc block at $zshrc"
      register: zsh_setup_zshrc_result
      changed_when: "'CHANGED:' in zsh_setup_zshrc_result.stdout"
      failed_when: zsh_setup_zshrc_result.rc != 0
      when: zsh_setup_execute | bool

    - name: Show zsh setup zshrc result
      ansible.builtin.debug:
        var: zsh_setup_zshrc_result.stdout_lines
      when: zsh_setup_execute | bool

    - name: Verify | inspect zsh setup state after operation
      ansible.builtin.raw: |
        set -eu

        zsh_user={{ zsh_setup_user | quote }}
        zsh_home={{ zsh_setup_home | quote }}
        zshrc="$zsh_home/.zshrc"
        begin_marker={{ zsh_setup_begin_marker | quote }}
        end_marker={{ zsh_setup_end_marker | quote }}

        fail() {
          echo "FAIL: $1"
          exit "$2"
        }

        check_repo() {
          repo_url="$1"
          repo_dest="$2"
          [ -d "$repo_dest/.git" ] || fail "missing Git checkout: $repo_dest" 30
          origin=$(git -C "$repo_dest" config --get remote.origin.url || true)
          [ "$origin" = "$repo_url" ] || fail "repository origin mismatch at $repo_dest: expected $repo_url, got $origin" 31
          echo "OK: repository verified: $repo_dest"
        }

        account_home=$(getent passwd "$zsh_user" | awk -F: '{ print $6 }')
        [ "$account_home" = "$zsh_home" ] || fail "zsh_setup_home must match getent passwd home for $zsh_user: expected $account_home, got $zsh_home" 20

        dpkg -s zsh >/dev/null 2>&1 || fail "package is not installed: zsh" 21
        dpkg -s git >/dev/null 2>&1 || fail "package is not installed: git" 22
        dpkg -s autojump >/dev/null 2>&1 || fail "package is not installed: autojump" 23
        echo "OK: packages verified: zsh git autojump"

        check_repo https://github.com/ohmyzsh/ohmyzsh.git "$zsh_home/.oh-my-zsh"
        check_repo https://github.com/zsh-users/zsh-autosuggestions.git "$zsh_home/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
        check_repo https://github.com/zsh-users/zsh-syntax-highlighting.git "$zsh_home/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"

        [ ! -L "$zshrc" ] || fail ".zshrc path is a symlink and will not be managed: $zshrc" 42
        [ -f "$zshrc" ] || fail ".zshrc does not exist: $zshrc" 40
        marker_report=$(awk -v begin="$begin_marker" -v end="$end_marker" '
          $0 == begin { begin_count++; if (first_begin == 0) first_begin = NR }
          $0 == end { end_count++; if (first_end == 0) first_end = NR }
          END { printf "%s %s %s %s\n", begin_count + 0, end_count + 0, first_begin + 0, first_end + 0 }
        ' "$zshrc")
        set -- $marker_report
        begin_count="$1"
        end_count="$2"
        first_begin="$3"
        first_end="$4"
        [ "$begin_count" -eq 1 ] && [ "$end_count" -eq 1 ] && [ "$first_begin" -lt "$first_end" ] || fail ".zshrc marker verification failed: begin=$begin_count end=$end_count first_begin=$first_begin first_end=$first_end" 41
        zsh -n "$zshrc"
        echo "OK: .zshrc markers and zsh syntax verified: $zshrc"
      register: zsh_setup_verify_result
      changed_when: false
      failed_when: zsh_setup_verify_result.rc != 0
      when: zsh_setup_execute | bool

    - name: Show zsh setup verify result
      ansible.builtin.debug:
        var: zsh_setup_verify_result.stdout_lines
      when: zsh_setup_execute | bool
